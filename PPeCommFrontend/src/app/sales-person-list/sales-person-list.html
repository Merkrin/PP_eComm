<table class="table table-hover">
  <thead class="table-dark">
  <tr>
    <th>First Name</th>
    <th>Last Name</th>
    <th>Email Address</th>
    <th>Phone Number</th>
    <th>Sales Volume</th>
    <th>Meets Quota?</th>
  </tr>
  </thead>
  <tbody>
    @for(salesPerson of salesPersonList; track $index){
  <tr>
    <td>{{salesPerson.firstName}}</td>
    <td>{{salesPerson.lastName}}</td>
    <td>{{salesPerson.email}}</td>
    <td>{{salesPerson.phoneNumber}}</td>
    <td>{{salesPerson.salesVolume}}</td>
  </tr>
  }
  </tbody>
</table>
